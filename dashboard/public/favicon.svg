<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    A scale with its ticks: an instrument, not a scoreboard. Deliberately not bars of
    differing height, which would read as a ranking of the providers being measured.
    The tab icon follows the browser chrome, not the page, so the stroke is defined for
    both themes rather than assuming a light one.
  -->
  <style>
    .mark { stroke: #1a1a18; }
    @media (prefers-color-scheme: dark) { .mark { stroke: #e8e8e3; } }
  </style>
  <g class="mark" fill="none" stroke-width="2.6" stroke-linecap="round">
    <path d="M4 23h24" />
    <path d="M8 23v-9" />
    <path d="M16 23v-15" />
    <path d="M24 23v-9" />
  </g>
</svg>
