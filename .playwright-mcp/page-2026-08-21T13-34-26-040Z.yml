                - generic [ref=f4e1237]:
                  - paragraph [ref=f4e1238]:
                    - img "Image" [ref=f4e1239]
                  - separator [ref=f4e1240]
                  - blockquote [ref=f4e1241]:
                    - 'heading "🔥 NEW: Wave 3 Pays in USDC" [level=2] [ref=f4e1242]'
                    - paragraph [ref=f4e1243]:
                      - strong [ref=f4e1244]: $7,500 in USDC + $7,500 in 0G Credits — a $15,000 reward pool for a single Wave.
                    - paragraph [ref=f4e1245]:
                      - text: You asked for real stablecoin rewards. We took it to the 0G Foundation, and they agreed. Starting Wave 3, half of the reward pool is paid in
                      - strong [ref=f4e1246]: USDC
                      - text: — real, liquid, straight to builders based on judged results.
                    - paragraph [ref=f4e1247]: This is the largest single-Wave pool of the entire program.
                    - paragraph [ref=f4e1248]:
                      - strong [ref=f4e1249]: 👉 Wave 3 is open. Register and start building.
                  - separator [ref=f4e1250]
                  - heading "About the Program" [level=2] [ref=f4e1251]
                  - paragraph [ref=f4e1252]: The 0G Bridge by AKINDO is a 10-week, 5-Wave Buildathon designed for Apollo Accelerator applicants and the broader builder community ready to ship the next generation of AI x Onchain applications on 0G.
                  - paragraph [ref=f4e1253]: Whether you applied to Apollo or you're discovering 0G for the first time, this is your structured pathway from prototype to mainnet — with USDC and 0G credits distributed wave-by-wave, technical support, and direct exposure to 0G's BD and investment teams.
                  - paragraph [ref=f4e1254]: This program is the bridge between idea and ecosystem. Build with us.
                  - separator [ref=f4e1255]
                  - heading "What is 0G?" [level=2] [ref=f4e1256]
                  - paragraph [ref=f4e1257]: 0G is the first decentralized AI Layer 1 blockchain designed to bring advanced AI to Onchain. It orchestrates hardware resources (storage and compute) and software assets (data and models) to handle AI workloads at scale — bridging the gap between centralized AI and open, decentralized blockchain systems.
                  - paragraph [ref=f4e1258]: "0G's modular architecture provides a full stack of independent services that you can use individually or combine:"
                  - list [ref=f4e1259]:
                    - listitem [ref=f4e1260]:
                      - strong [ref=f4e1261]: 0G Chain
                      - text: — A fast, modular, EVM-compatible blockchain for executing AI transactions and smart contracts
                    - listitem [ref=f4e1262]:
                      - strong [ref=f4e1263]: 0G Compute
                      - text: — A global network for running AI inference, model training, and verifiable compute
                    - listitem [ref=f4e1264]:
                      - strong [ref=f4e1265]: 0G Storage
                      - text: — Decentralized storage for massive AI datasets and models
                    - listitem [ref=f4e1266]:
                      - strong [ref=f4e1267]: 0G Data Availability (DA)
                      - text: — Infinitely scalable data availability for high-throughput AI and blockchain applications
                    - listitem [ref=f4e1268]:
                      - strong [ref=f4e1269]: Agentic ID (ERC-7857)
                      - text: — A new token standard for tokenizing AI agents with their full intelligence intact
                  - paragraph [ref=f4e1270]: Build powerful, censorship-resistant, verifiable onchain AI applications. Break the barriers of cost, speed, and lock-in that have kept AI centralized.
                  - paragraph [ref=f4e1271]:
                    - text: "📚 Official Docs:"
                    - link "https://docs.0g.ai/" [ref=f4e1272] [cursor=pointer]:
