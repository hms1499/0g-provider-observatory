                  - heading "Why Join 0G Bridge by AKINDO?" [level=2] [ref=f4e1275]
                  - paragraph [ref=f4e1276]:
                    - strong [ref=f4e1277]: 💵 USDC + 0G Credits — Up to $50,000 Total
                    - text: "Wave 3 introduces real stablecoin rewards:"
                    - strong [ref=f4e1278]: $7,500 in USDC + $7,500 in 0G credits
                    - text: . USDC lands directly with builders based on judged results. Credits fuel your compute, storage, and inference on 0G. No progress, no reward — but real builds get paid.
                  - paragraph [ref=f4e1279]:
                    - strong [ref=f4e1280]: 🚀 Direct Path to 0G Investment & Apollo
                    - text: Top performers get recommended to the 0G Investment Committee, Deal Room, and the next Apollo cohort. The Bridge is real.
                  - paragraph [ref=f4e1281]:
                    - strong [ref=f4e1282]: 🤖 AI-Assisted Evaluation
                    - text: Every submission scored by AKINDO's AI evaluation system, plus human review by 0G judges. Fast, transparent, fair.
                  - paragraph [ref=f4e1283]:
                    - strong [ref=f4e1284]: 🌍 Global Exposure
                    - text: Featured on AKINDO's platform with reach to 12,000+ monthly active builders, plus amplification across 0G's official channels (X, Discord, Telegram, blog, newsletter).
                  - paragraph [ref=f4e1285]:
                    - strong [ref=f4e1286]: 🛠 Hands-On Support
                    - text: Bi-weekly progress tracking, kickoff workshop, technical resources, and direct access to 0G's DevRel team for integration help.
                  - paragraph [ref=f4e1287]:
                    - strong [ref=f4e1288]: 📈 Bridge Bonus
                    - text: Continuation pathway for builders ready to graduate from Apollo, APAC Hackathon, or any prior 0G builder activation.
                  - separator [ref=f4e1289]
                  - heading "What to Build" [level=2] [ref=f4e1290]
                  - paragraph [ref=f4e1291]: The 0G Bridge Buildathon is open-ended by design. There are no fixed tracks — you're free to build anything that leverages 0G's modular infrastructure to ship real AI x Web3 applications to mainnet.
                  - paragraph [ref=f4e1292]: "If you're looking for inspiration, here are areas where 0G's ecosystem is gaining the most traction (based on Apollo's 2026 cohort):"
                  - paragraph [ref=f4e1293]:
                    - strong [ref=f4e1294]: 🤖 AI Agents
                    - text: Autonomous agents that operate onchain. Agent infrastructure, multi-agent systems, AI-powered DAOs, agent wallets, Agentic IDs.
                  - paragraph [ref=f4e1295]:
                    - strong [ref=f4e1296]: 🛡 Trust & Safety
                    - text: AI guardrails, deepfake detection, content verification, fraud detection, compliance, AI safety infrastructure.
                  - paragraph [ref=f4e1297]:
                    - strong [ref=f4e1298]: 🏦 Finance
                    - text: DeFi + AI, credit for AI agents, AI-driven trading, neobanks, on-chain financial intelligence.
                  - paragraph [ref=f4e1299]:
                    - strong [ref=f4e1300]: 📊 Data & Infrastructure
                    - text: Decentralized AI training data, model marketplaces, verifiable compute pipelines, on-chain data markets.
                  - paragraph [ref=f4e1301]:
                    - strong [ref=f4e1302]: 🎮 Consumer & Gaming
                    - text: AI-powered consumer apps, games with AI NPCs, dynamic NFTs, decentralized content with AI.
                  - paragraph [ref=f4e1303]:
                    - strong [ref=f4e1304]: 🔧 Developer Tooling
                    - text: SDKs, analytics dashboards, deployment tools, testing frameworks for the 0G ecosystem.
                  - paragraph [ref=f4e1305]: Cross-area projects are highly encouraged — the best AI x Web3 applications often combine multiple of these.
                  - separator [ref=f4e1306]
                  - heading "Program Structure" [level=2] [ref=f4e1307]
                  - paragraph [ref=f4e1308]:
                    - strong [ref=f4e1309]: 10 weeks · 5 Waves · Continuous Reward Distribution
                  - paragraph [ref=f4e1310]:
                    - strong [ref=f4e1311]: Each Wave is approximately 2 weeks. There are no fixed milestones you must hit in any given Wave — build freely at your own pace. At the end of each Wave, submit your progress, and AKINDO's AI + 0G judges evaluate every team based on how far they've moved their project forward. Rewards flow to teams making real progress.
                  - paragraph [ref=f4e1312]:
                    - strong [ref=f4e1313]: From Wave 3 onward, rewards include USDC alongside 0G credits.
                  - paragraph [ref=f4e1314]:
                    - text: "| Wave | Reward Pool | Breakdown | | Wave 1 | $5,000 | 0G Credits | | Wave 2 | $7,500 | 0G Credits | |"
                    - strong [ref=f4e1315]: Wave 3
                    - text: "|"
                    - strong [ref=f4e1316]: $15,000
                    - text: "|"
                    - strong [ref=f4e1317]: $7,500 USDC + $7,500 Credits
                    - text: 🔥 | | Wave 4 | $10,000 | TBA | | Wave 5 | $12,500 | TBA |
                  - heading "Reward Distribution" [level=3] [ref=f4e1318]
                  - paragraph [ref=f4e1319]: The $50,000 total pool is distributed across all 5 Waves. Each Wave, rewards are allocated to teams based on their progress — there are no fixed milestones required. The later Waves carry larger allocations to reward sustained building over the full program.
                  - paragraph [ref=f4e1320]:
                    - strong [ref=f4e1321]: "Wave 3 is the turning point:"
                    - text: it carries the largest single-Wave pool AND introduces USDC. Half the pool is now real stablecoin, paid directly to builders. The other half is 0G credits, issued via 0G Pay and usable across 0G's infrastructure (Compute, Storage, and more).
                  - paragraph [ref=f4e1322]:
                    - text: "| Wave | Allocation | Reward Pool | Format | | Wave 1 | 10% | $5,000 | Credits | | Wave 2 | 15% | $7,500 | Credits | |"
                    - strong [ref=f4e1323]: Wave 3
                    - text: "|"
                    - strong [ref=f4e1324]: 30%
                    - text: "|"
                    - strong [ref=f4e1325]: $15,000
                    - text: "|"
                    - strong [ref=f4e1326]: $7,500 USDC + $7,500 Credits
                    - text: "| | Wave 4 | 20% | $10,000 | TBA | | Wave 5 | 25% | $12,500 | TBA | | Total | 100% | $50,000 | |"
                  - paragraph [ref=f4e1327]:
                    - strong [ref=f4e1328]: Why this structure?
                    - text: Every Wave rewards teams based on how far they've pushed their project — no rigid checkpoints Wave 3 carries the largest pool of the program and introduces USDC — if you join one Wave, make it this one Later Waves carry larger allocations to reward teams who keep building and sustain momentum Teams that participate consistently across all 5 Waves are eligible for the Multi-Wave Completion Bonus Unused rewards in any Wave may roll over to subsequent Waves based on 0G's final allocation decisions.
                  - heading "🎤 Demo Day at Token2049 Singapore (October 2026)" [level=3] [ref=f4e1329]
                  - paragraph [ref=f4e1330]:
                    - text: The 0G Bridge Buildathon will culminate in a Demo Day timed around
                    - strong [ref=f4e1331]: Token2049 Singapore (October 7–8, 2026)
                    - text: — one of the largest crypto conferences of the year. Top-performing teams will present their mainnet projects to investors, 0G's BD and investment teams, and the broader Web3 community.
                  - paragraph [ref=f4e1332]: The format (in-person side event at Token2049, virtual livestream, or hybrid) will be confirmed mid-program based on participant momentum and logistics. Stay tuned for announcements.
                  - separator [ref=f4e1333]
                  - heading "Bonus" [level=2] [ref=f4e1334]
                  - paragraph [ref=f4e1335]:
                    - strong [ref=f4e1336]: 🎁 Multi-Wave Completion Bonus
                    - text: Teams that submit progress in all 5 Waves unlock additional credit rewards — designed to encourage long-term building, not one-shot submissions.
                  - paragraph [ref=f4e1337]:
                    - strong [ref=f4e1338]: 🌉 Apollo Bridge Recognition
                    - text: Apollo applicants who complete the program receive priority consideration for the next Apollo cohort and direct introductions to 0G's BD team.
                  - paragraph [ref=f4e1339]:
                    - strong [ref=f4e1340]: 📈 Post-Buildathon Continuation
                    - text: Teams that continue building after Wave 5 will be supported with potential investment opportunities through 0G's Investment Committee.
