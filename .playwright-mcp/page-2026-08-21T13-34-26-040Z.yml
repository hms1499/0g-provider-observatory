                  - heading "Rules" [level=2] [ref=f4e1475]
                  - list [ref=f4e1476]:
                    - listitem [ref=f4e1477]:
                      - strong [ref=f4e1478]: "Submission Platform:"
                      - text: All projects must be submitted through AKINDO before each Wave deadline
                    - listitem [ref=f4e1479]:
                      - strong [ref=f4e1480]: "Resubmissions:"
                      - text: Teams can update and resubmit before the final Wave deadline. Clearly state what's new
                    - listitem [ref=f4e1481]:
                      - strong [ref=f4e1482]: "Originality:"
                      - text: All work must be your own or properly credited. Reused code must be open source and cited
                    - listitem [ref=f4e1483]:
                      - strong [ref=f4e1484]: "Intellectual Property:"
                      - text: Projects must not infringe on third-party copyrights, patents, or trademarks
                    - listitem [ref=f4e1485]:
                      - strong [ref=f4e1486]: "Multiple Waves:"
                      - text: You can participate in multiple Waves. Each submission should show real progress
                    - listitem [ref=f4e1487]:
                      - strong [ref=f4e1488]: "Eligibility:"
                      - text: Teams of any size, but each member can only join one team per Wave
                    - listitem [ref=f4e1489]:
