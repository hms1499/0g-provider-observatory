                  - separator [ref=f4e1409]
                  - heading "Submission Requirements" [level=2] [ref=f4e1410]
                  - paragraph [ref=f4e1411]: "Each submission per Wave must include:"
                  - heading "1. Project Information" [level=3] [ref=f4e1412]
                  - list [ref=f4e1413]:
                    - listitem [ref=f4e1414]: Project name and one-line description (max 30 words)
                    - listitem [ref=f4e1415]: "Short summary: what it does, what problem it solves, which 0G components it uses"
                  - heading "2. Code Repository" [level=3] [ref=f4e1416]
                  - list [ref=f4e1417]:
                    - listitem [ref=f4e1418]: Public GitHub repo (or shared with judges)
                    - listitem [ref=f4e1419]: Meaningful commits during the Wave period
                    - listitem [ref=f4e1420]: README with setup instructions
                  - heading "3. 0G Integration Proof (Wave 3 onwards)" [level=3] [ref=f4e1421]
                  - list [ref=f4e1422]:
                    - listitem [ref=f4e1423]: 0G mainnet contract address
                    - listitem [ref=f4e1424]: 0G Explorer link showing on-chain activity
                    - listitem [ref=f4e1425]: Clear proof of at least one 0G component integrated
                  - heading "4. Demo Video" [level=3] [ref=f4e1426]
                  - list [ref=f4e1427]:
                    - listitem [ref=f4e1428]: Maximum 3 minutes
                    - listitem [ref=f4e1429]: Show core functionality, user flow, and 0G integration
                    - listitem [ref=f4e1430]: Hosted publicly (YouTube, Loom)
                  - heading "5. Documentation" [level=3] [ref=f4e1431]
                  - list [ref=f4e1432]:
                    - listitem [ref=f4e1433]: Architecture diagram or technical description
                    - listitem [ref=f4e1434]: Which 0G modules are used and how
                    - listitem [ref=f4e1435]: Local deployment or reproduction steps
                  - heading "6. Public X Post (Mandatory)" [level=3] [ref=f4e1436]
                  - paragraph [ref=f4e1437]: "Each submission must include at least one public project post on X with:"
                  - list [ref=f4e1438]:
                    - listitem [ref=f4e1439]: Project name
                    - listitem [ref=f4e1440]: Demo screenshot or short clip
                    - listitem [ref=f4e1441]:
                      - text: "Hashtags:"
                      - strong [ref=f4e1442]: "#0GBridge #BuildOn0G"
                    - listitem [ref=f4e1443]:
                      - text: "Tags:"
                      - strong [ref=f4e1444]: "@0G_labs @0G_Builders @AKINDO_io"
                  - heading "7. Optional Bonus Materials" [level=3] [ref=f4e1445]
                  - list [ref=f4e1446]:
                    - listitem [ref=f4e1447]: Pitch deck
                    - listitem [ref=f4e1448]: User feedback or testing notes
                    - listitem [ref=f4e1449]: Tutorial or technical write-up
                    - listitem [ref=f4e1450]: Frontend demo link
                  - separator [ref=f4e1451]
                  - heading "Judging Criteria" [level=2] [ref=f4e1452]
                  - paragraph [ref=f4e1453]: Evaluation is performed via AKINDO's DD Arena AI evaluation system combined with human review by designated 0G judges. Every Wave, teams are evaluated on their progress — how far they've moved their project forward since the last Wave — rather than against fixed milestones. Build at your own pace.
                  - paragraph [ref=f4e1454]: "What judges look for: Progress & Momentum (40%) — Meaningful advancement of your project this Wave, whatever stage you're at 0G Integration (30%) — Depth and quality of your use of 0G's modular stack (Chain, Compute, Storage, Agentic ID, 0G Pay) Technical Quality & Execution (20%) — Code quality, architecture, security, completeness Traction & Communication (10%) — Real usage where applicable, documentation, demo clarity, and public updates"
                  - paragraph [ref=f4e1455]: "Note: We encourage teams to work toward mainnet deployment over the course of the program, and to integrate at least one 0G component as your project matures. Projects with real 0G integration are prioritized in evaluation."
