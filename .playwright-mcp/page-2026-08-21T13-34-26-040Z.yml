                  - heading "FAQ" [level=2] [ref=f4e1517]
                  - paragraph [ref=f4e1518]:
                    - strong [ref=f4e1519]: "Q: Do I need to be an Apollo applicant to join?"
                    - text: "A: No. The program is open to all builders — Apollo applicants, APAC Hackathon participants, AKINDO community, and new builders discovering 0G for the first time."
                  - paragraph [ref=f4e1520]:
                    - strong [ref=f4e1521]: "Q: When are rewards distributed?"
                    - text: "A: After each Wave. AKINDO's AI evaluation + 0G judges score submissions, and rewards are distributed based on demonstrated progress."
                  - paragraph [ref=f4e1522]:
                    - strong [ref=f4e1523]: "Q: What are the rewards distributed as?"
                    - text: "A: From Wave 3 onward, rewards include"
                    - strong [ref=f4e1524]: USDC
                    - text: alongside 0G credits. Wave 3's pool is $7,500 in USDC + $7,500 in credits. USDC is paid directly to builders based on judged results. Credits are issued via 0G Pay and are usable across 0G's infrastructure (Compute, Storage, and more).
                  - paragraph [ref=f4e1525]:
                    - strong [ref=f4e1526]: "Q: Why did the rewards change to include USDC?"
                    - text: "A: Builders told us directly that credits alone weren't enough incentive. We raised it with the 0G Foundation, and they agreed. 0G wants to find and support serious teams building long-term on their stack — and they're backing that with real capital."
                  - paragraph [ref=f4e1527]:
                    - strong [ref=f4e1528]: "Q: How is USDC distribution decided?"
                    - text: "A: Submissions are evaluated by AKINDO's AI system and 0G judges, with additional verification from 0G's DevRel team confirming genuine 0G integration. USDC is then distributed based on those results."
                  - paragraph [ref=f4e1529]:
                    - strong [ref=f4e1530]: "Q: What if I miss a Wave?"
                    - text: "A: You can rejoin in any subsequent Wave. However, multi-Wave completion is rewarded, so consistent participation is encouraged."
                  - paragraph [ref=f4e1531]:
                    - strong [ref=f4e1532]: "Q: Can I submit the same project I submitted to Apollo?"
                    - text: "A: Yes — in fact, it's encouraged. Continue building what you started."
                  - paragraph [ref=f4e1533]:
                    - strong [ref=f4e1534]: "Q: Can I use 0G testnet for early Waves?"
                    - text: "A: Yes. Wave 3 onwards requires mainnet deployment for 0G Chain integration. Compute Network and DA can remain on testnet."
                  - paragraph [ref=f4e1535]:
                    - strong [ref=f4e1536]: "Q: What happens after Wave 5?"
                    - text: "A: Top performers get recommended to the 0G Investment Committee, Deal Room, and next Apollo cohort. The Demo Day around Token2049 Singapore (October 2026) showcases finalists to the broader 0G and Crypto community."
                  - paragraph [ref=f4e1537]:
                    - strong [ref=f4e1538]: "Q: Will the Demo Day be in-person at Token2049?"
                    - text: "A: The format (in-person, virtual, or hybrid) will be confirmed mid-program. We're aiming to align with Token2049 Singapore (October 7–8, 2026) for maximum visibility. Updates will be announced as the program progresses."
                  - paragraph [ref=f4e1539]:
                    - strong [ref=f4e1540]: "Q: Is there a participation fee?"
                    - text: "A: No. Participation is free."
